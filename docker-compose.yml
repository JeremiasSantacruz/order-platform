networks:
  order-network:
    driver: bridge

services:
  # MongoDB for Products
  db-product:
    image: mongo:8.0
    container_name: order-mongo
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: product
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: catalog_db, orders_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express UI
  db-client:
    image: mongo-express:latest
    container_name: order-mongo-express
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: product
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://product:secret@db-product:27017/
      ME_CONFIG_MONGODB_DEFAULT_DBNAME: catalog_db
    depends_on:
      db-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header", "Authorization: Basic YWRtaW46cGFzcw==", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order-zookeeper
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Apache Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order-kafka
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafdrop UI for Kafka monitoring
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: order-kafdrop
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET / HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Clients API (NestJS)
  clients-api:
    build:
      context: ./clients-api
      dockerfile: Dockerfile.yml
    container_name: order-clients-api
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # Products API (Go)
  products-api:
    build:
      context: ./products-api
      dockerfile: Dockerfile.yml
    container_name: order-products-api
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://product:secret@db-product:27017/?authSource=admin
    depends_on:
      db-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

  # Order Processor (Java / Spring Boot worker)
  order-processor:
    build:
      context: ./order-processor
      dockerfile: Dockerfile
    container_name: order-processor
    restart: unless-stopped
    networks:
      - order-network
    environment:
      # Consumo del broker interno de Kafka (application.yaml usa KAFKA_BOOTSTRAP_SERVERS).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Persistencia del agregado Order (base propia, distinta de catalog_db).
      MONGO_URI: mongodb://product:secret@db-product:27017/orders_db?authSource=admin
      # Contratos de salida hacia los servicios internos (secciones 5.B y 5.C).
      CLIENTS_API_BASE_URL: http://clients-api:3000
      PRODUCTS_API_BASE_URL: http://products-api:8082
    depends_on:
      kafka:
        condition: service_healthy
      db-product:
        condition: service_healthy
    # Worker sin API HTTP: no expone puertos.
    profiles:
      - full

  # --- Observabilidad de logs -----------------------------------------------------
  # Loki: almacén de logs consultable con LogQL (http://localhost:3100).
  loki:
    image: grafana/loki:3.6.17
    container_name: order-loki
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    # Sin healthcheck: la imagen es distroless (no hay shell ni wget).
    # /ready se puede comprobar desde el host: curl http://localhost:3100/ready

  # Promtail: tail de los stdout de los contenedores (docker.sock) hacia Loki.
  promtail:
    image: grafana/promtail:3.6.11
    container_name: order-promtail
    restart: unless-stopped
    networks:
      - order-network
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Grafana: UI de consulta de logs (admin/admin en local).
  # El puerto del host es 3001 para no chocar con clients-api (:3000).
  grafana:
    image: grafana/grafana:13.0.10
    container_name: order-grafana
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
    driver: local
  grafana-data:
    driver: local
