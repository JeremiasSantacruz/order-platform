version: '3.9'

networks:
  order-network:
    driver: bridge

services:
  # MongoDB for Products
  db-product:
    image: mongo:8.0
    container_name: order-mongo
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: product
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: catalog_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express UI
  db-client:
    image: mongo-express:latest
    container_name: order-mongo-express
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: product
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://product:secret@db-product:27017/
      ME_CONFIG_MONGODB_DEFAULT_DBNAME: catalog_db
    depends_on:
      db-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order-zookeeper
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Apache Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order-kafka
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafdrop UI for Kafka monitoring
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: order-kafdrop
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Clients API (NestJS)
  clients-api:
    build:
      context: ./clients-api
      dockerfile: Dockerfile.yml
    container_name: order-clients-api
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

  # Products API (Go)
  products-api:
    build:
      context: ./products-api
      dockerfile: Dockerfile.yml
    container_name: order-products-api
    restart: unless-stopped
    networks:
      - order-network
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://product:secret@db-product:27017/?authSource=admin
    depends_on:
      db-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

  # Order Processor (Java / Spring Boot worker)
  order-processor:
    build:
      context: ./order-processor
      dockerfile: Dockerfile
    container_name: order-processor
    restart: unless-stopped
    networks:
      - order-network
    environment:
      # Consumo del broker interno de Kafka (application.yaml usa KAFKA_BOOTSTRAP_SERVERS).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Persistencia del agregado Order (base propia, distinta de catalog_db).
      MONGO_URI: mongodb://product:secret@db-product:27017/orders_db?authSource=admin
      # Contratos de salida hacia los servicios internos (secciones 5.B y 5.C).
      CLIENTS_API_BASE_URL: http://clients-api:3000
      PRODUCTS_API_BASE_URL: http://products-api:8082
    depends_on:
      kafka:
        condition: service_healthy
      db-product:
        condition: service_healthy
    # Worker sin API HTTP: no expone puertos.
    profiles:
      - full

volumes:
  mongo-data:
    driver: local
