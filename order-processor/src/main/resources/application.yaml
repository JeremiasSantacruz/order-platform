spring:
  application:
    name: order-processor

  # --- Modelo de ejecución ---------------------------------------------------------
  # Hilos virtuales (JDK 21): Spring Boot configura el listener de Kafka con un
  # SimpleAsyncTaskExecutor virtual y el applicationTaskExecutor con hilos virtuales.
  # Todo el procesamiento de un mensaje es I/O bloqueante (Kafka, HTTP, Mongo), así que
  # el hilo virtual se desmonta durante cada espera en lugar de ocupar un hilo de plataforma.
  # Nota (Spring Kafka): con hilos virtuales la concurrencia del listener no debe superar
  # los núcleos disponibles para evitar pinning; aquí se mantiene el valor por defecto (1).
  threads:
    virtual:
      enabled: true

  # --- Interfaz de entrada Kafka -------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-processor}
      auto-offset-reset: earliest
      enable-auto-commit: false
      # El payload se consume como String crudo: conserva el original para la DLT y
      # permite clasificar los errores de contrato en el listener.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Serializadores para las dos salidas Kafka: orders.processed.v1 y la DLT.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Commit por registro: el offset se confirma cuando el listener termina sin error.
      ack-mode: record

  # --- Interfaz de salida: persistencia del agregado Order ------------------------
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/orders_db}

resilience4j:
  ratelimiter:
    instances:
      clients-api:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 1s
      products-api:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 1s
  retry:
    instances:
      clients-api:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 4s
        fail-after-max-attempts: true
        retry-exception-predicate: jeremias.santacruz.order_processor.infrastructure.config.RetryableExternalServicePredicate
      products-api:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 4s
        fail-after-max-attempts: true
        retry-exception-predicate: jeremias.santacruz.order_processor.infrastructure.config.RetryableExternalServicePredicate

app:
  kafka:
    topics:
      orders-created: orders.created.v1
      orders-created-dlt: orders.processing.dlt
      orders-processed: orders.processed.v1
    consumer:
      # Reintentos con backoff exponencial para fallos transitorios (429/5xx/timeout);
      # al agotarlos, el mensaje se publica en la DLT orders.processing.dlt.
      max-retries: 3

  # --- Interfaz de salida HTTP (secciones 5.B y 5.C) ------------------------------
  clients:
    base-url: ${CLIENTS_API_BASE_URL:http://localhost:3000}
    connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:5000}
  products:
    base-url: ${PRODUCTS_API_BASE_URL:http://localhost:8082}
    connect-timeout-ms: ${PRODUCTS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PRODUCTS_READ_TIMEOUT_MS:5000}
